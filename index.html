<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP Arka Planı</title>
    <style>
        /* Sayfa kenarlarındaki varsayılan boşlukları sıfırlıyoruz */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Verdiğiniz resim bağlantısını arka plan yapıyoruz */
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBcFS1B-OjW5TFyyNqC9hSDv89B5fDhBm-QsifYEPqvg&s=10');
            
            /* Resmin ekranı tamamen kaplamasını sağlar */
            background-size: cover;
            
            /* Resmin tekrar etmesini engeller */
            background-repeat: no-repeat;
            
            /* Resmi ekranda ortalar */
            background-position: center center;
            
            /* Sayfa kaydırılsa bile resmin sabit kalmasını sağlar */
            background-attachment: fixed;
            
            /* Sayfanın en az ekran yüksekliği kadar olmasını zorunlu kılıyoruz */
            min-height: 100vh; 
        }
    </style>
</head>
<body>

    <!-- Web sayfanızın içeriklerini buraya ekleyebilirsiniz -->

</body>
</html>
