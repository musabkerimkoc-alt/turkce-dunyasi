<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermer Arka Planlı Sayfa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 1. Resminizin yolunu buraya yazın */
            background-image: url('mermer-arkaplan.jpg');
            
            /* 2. Resmin ekranı tamamen kaplamasını sağlar */
            background-size: cover;
            
            /* 3. Resmin tekrar etmesini (döşenmesini) engeller */
            background-repeat: no-repeat;
            
            /* 4. Resmi hem yatayda hem dikeyde ortalar */
            background-position: center center;
            
            /* 5. Sayfa aşağı kaydırılsa bile resmin sabit kalmasını sağlar */
            background-attachment: fixed;

            /* Yazıların okunabilirliği için örnek font ve renk */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* İçeriklerin arka plandan ayrışması için örnek şeffaf kutu */
        .icerik-kutusu {
            background: rgba(255, 255, 255, 0.85); /* Hafif şeffaf beyaz */
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 200px; /* Sayfa kaydırma simülasyonu için yüksek boşluk */
        }
    </style>
</head>
<body>

    <div class="icerik-kutusu">
        <h1>Şık Tasarım</h1>
        <p>Mermer arka plan üzerine yerleştirilmiş temiz bir içerik alanı örneği.</p>
    </div>

</body>
</html>
